<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Innovation-aligned crossover in NEATBird</title>
  <desc id="desc">Connection genes from two parents are placed in columns by innovation number. Matching genes share endpoints and one parent version is selected. Genes found in only one parent are still copied. The child contains innovations zero through five.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102722" />
      <stop offset="1" stop-color="#0b1d1a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#06110f" flood-opacity="0.42" />
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #fff7e7; font-size: 35px; font-weight: 700; letter-spacing: -0.5px; }
      .subtitle { fill: #b8c4b1; font-size: 18px; }
      .row-label { fill: #fff7e7; font-size: 22px; font-weight: 700; }
      .row-note { fill: #b8c4b1; font-size: 15px; }
      .column-id { fill: #7ed6c6; font-size: 18px; font-weight: 700; }
      .connection { fill: #fff7e7; font-size: 15px; font-weight: 650; }
      .weight { fill: #d9cdbb; font-size: 15px; }
      .tag { font-size: 12px; font-weight: 800; letter-spacing: 0.8px; }
      .legend { fill: #d9cdbb; font-size: 14px; }
      .footer { fill: #d9cdbb; font-size: 17px; }
      .footer-strong { fill: #fff7e7; font-size: 17px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1400" height="920" rx="24" fill="url(#bg)" />
  <circle cx="1260" cy="70" r="180" fill="#7ed6c6" opacity="0.035" />
  <circle cx="112" cy="860" r="210" fill="#ff7a4f" opacity="0.035" />

  <g class="sans">
    <text x="54" y="66" class="title">Crossover lines genes up by innovation number</text>
    <text x="54" y="98" class="subtitle">The ID is process-wide: the same number always means the same source → destination pair.</text>

    <g transform="translate(1000 46)">
      <circle cx="8" cy="8" r="7" fill="#7ed6c6" />
      <text x="24" y="13" class="legend">matching gene</text>
      <circle cx="160" cy="8" r="7" fill="#ff7a4f" />
      <text x="176" y="13" class="legend">Parent A only</text>
      <circle cx="160" cy="38" r="7" fill="#f3c77b" />
      <text x="176" y="43" class="legend">Parent B only</text>
    </g>

    <g opacity="0.13" stroke="#7ed6c6" stroke-width="1">
      <line x1="237" y1="144" x2="237" y2="792" />
      <line x1="429" y1="144" x2="429" y2="792" />
      <line x1="621" y1="144" x2="621" y2="792" />
      <line x1="813" y1="144" x2="813" y2="792" />
      <line x1="1005" y1="144" x2="1005" y2="792" />
      <line x1="1197" y1="144" x2="1197" y2="792" />
    </g>

    <g text-anchor="middle">
      <text x="237" y="151" class="column-id">INNOV #0</text>
      <text x="429" y="151" class="column-id">INNOV #1</text>
      <text x="621" y="151" class="column-id">INNOV #2</text>
      <text x="813" y="151" class="column-id">INNOV #3</text>
      <text x="1005" y="151" class="column-id">INNOV #4</text>
      <text x="1197" y="151" class="column-id">INNOV #5</text>
    </g>

    <g>
      <text x="54" y="224" class="row-label">Parent A</text>
      <text x="54" y="249" class="row-note">five genes</text>

      <g transform="translate(158 178)" filter="url(#shadow)">
        <rect width="158" height="124" rx="12" fill="#18352f" stroke="#7ed6c6" stroke-width="2" />
        <rect width="158" height="7" rx="4" fill="#7ed6c6" />
        <text x="16" y="44" class="connection">input 0 → output</text>
        <text x="16" y="72" class="weight">weight +0.42</text>
        <text x="16" y="101" class="tag" fill="#7ed6c6">MATCH</text>
      </g>
      <g transform="translate(350 178)" filter="url(#shadow)">
        <rect width="158" height="124" rx="12" fill="#18352f" stroke="#7ed6c6" stroke-width="2" />
        <rect width="158" height="7" rx="4" fill="#7ed6c6" />
        <text x="16" y="44" class="connection">input 1 → output</text>
        <text x="16" y="72" class="weight">weight −0.18</text>
        <text x="16" y="101" class="tag" fill="#7ed6c6">MATCH</text>
      </g>
      <g transform="translate(542 178)" filter="url(#shadow)">
        <rect width="158" height="124" rx="12" fill="#18352f" stroke="#7ed6c6" stroke-width="2" />
        <rect width="158" height="7" rx="4" fill="#7ed6c6" />
        <text x="16" y="44" class="connection">bias → output</text>
        <text x="16" y="72" class="weight">weight +0.08</text>
        <text x="16" y="101" class="tag" fill="#7ed6c6">MATCH</text>
      </g>
      <g transform="translate(734 178)" filter="url(#shadow)">
        <rect width="158" height="124" rx="12" fill="#2e2b22" stroke="#ff7a4f" stroke-width="2" />
        <rect width="158" height="7" rx="4" fill="#ff7a4f" />
        <text x="16" y="44" class="connection">input 0 → hidden</text>
        <text x="16" y="72" class="weight">weight +0.74</text>
        <text x="16" y="101" class="tag" fill="#ff7a4f">A ONLY</text>
      </g>
      <g transform="translate(926 178)" filter="url(#shadow)">
        <rect width="158" height="124" rx="12" fill="#18352f" stroke="#7ed6c6" stroke-width="2" />
        <rect width="158" height="7" rx="4" fill="#7ed6c6" />
        <text x="16" y="44" class="connection">hidden → output</text>
        <text x="16" y="72" class="weight">weight −0.55</text>
        <text x="16" y="101" class="tag" fill="#7ed6c6">MATCH</text>
      </g>
      <g transform="translate(1118 178)">
        <rect width="158" height="124" rx="12" fill="none" stroke="#7ed6c6" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="8 7" />
        <text x="79" y="70" text-anchor="middle" class="weight" opacity="0.55">not present</text>
      </g>
    </g>

    <g>
      <text x="54" y="428" class="row-label">Parent B</text>
      <text x="54" y="453" class="row-note">five genes</text>

      <g transform="translate(158 382)" filter="url(#shadow)">
        <rect width="158" height="124" rx="12" fill="#18352f" stroke="#7ed6c6" stroke-width="2" />
        <rect width="158" height="7" rx="4" fill="#7ed6c6" />
        <text x="16" y="44" class="connection">input 0 → output</text>
        <text x="16" y="72" class="weight">weight +0.37</text>
        <text x="16" y="101" class="tag" fill="#7ed6c6">MATCH</text>
      </g>
      <g transform="translate(350 382)" filter="url(#shadow)">
        <rect width="158" height="124" rx="12" fill="#18352f" stroke="#7ed6c6" stroke-width="2" />
        <rect width="158" height="7" rx="4" fill="#7ed6c6" />
        <text x="16" y="44" class="connection">input 1 → output</text>
        <text x="16" y="72" class="weight">weight −0.31</text>
        <text x="16" y="101" class="tag" fill="#7ed6c6">MATCH</text>
      </g>
      <g transform="translate(542 382)" filter="url(#shadow)">
        <rect width="158" height="124" rx="12" fill="#18352f" stroke="#7ed6c6" stroke-width="2" />
        <rect width="158" height="7" rx="4" fill="#7ed6c6" />
        <text x="16" y="44" class="connection">bias → output</text>
        <text x="16" y="72" class="weight">weight +0.12</text>
        <text x="16" y="101" class="tag" fill="#7ed6c6">MATCH</text>
      </g>
      <g transform="translate(734 382)">
        <rect width="158" height="124" rx="12" fill="none" stroke="#7ed6c6" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="8 7" />
        <text x="79" y="70" text-anchor="middle" class="weight" opacity="0.55">not present</text>
      </g>
      <g transform="translate(926 382)" filter="url(#shadow)">
        <rect width="158" height="124" rx="12" fill="#18352f" stroke="#7ed6c6" stroke-width="2" />
        <rect width="158" height="7" rx="4" fill="#7ed6c6" />
        <text x="16" y="44" class="connection">hidden → output</text>
        <text x="16" y="72" class="weight">weight −0.61</text>
        <text x="16" y="101" class="tag" fill="#7ed6c6">MATCH</text>
      </g>
      <g transform="translate(1118 382)" filter="url(#shadow)">
        <rect width="158" height="124" rx="12" fill="#322f22" stroke="#f3c77b" stroke-width="2" />
        <rect width="158" height="7" rx="4" fill="#f3c77b" />
        <text x="16" y="44" class="connection">input 1 → hidden</text>
        <text x="16" y="72" class="weight">weight +0.29</text>
        <text x="16" y="101" class="tag" fill="#f3c77b">B ONLY</text>
      </g>
    </g>

    <g transform="translate(54 548)">
      <path d="M0 0 H1292" stroke="#7ed6c6" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="5 8" />
      <rect x="356" y="-18" width="580" height="36" rx="18" fill="#17332d" stroke="#7ed6c6" stroke-opacity="0.35" />
      <text x="646" y="6" text-anchor="middle" class="legend">matching: choose either parent · one-sided: copy the gene</text>
    </g>

    <g>
      <text x="54" y="668" class="row-label">Child</text>
      <text x="54" y="693" class="row-note">six inherited genes</text>

      <g transform="translate(158 622)" filter="url(#shadow)">
        <rect width="158" height="124" rx="12" fill="#18352f" stroke="#7ed6c6" stroke-width="2" />
        <rect width="158" height="7" rx="4" fill="#7ed6c6" />
        <text x="16" y="44" class="connection">input 0 → output</text>
        <text x="16" y="72" class="weight">weight +0.37</text>
        <text x="16" y="101" class="tag" fill="#7ed6c6">FROM B</text>
      </g>
      <g transform="translate(350 622)" filter="url(#shadow)">
        <rect width="158" height="124" rx="12" fill="#18352f" stroke="#7ed6c6" stroke-width="2" />
        <rect width="158" height="7" rx="4" fill="#7ed6c6" />
        <text x="16" y="44" class="connection">input 1 → output</text>
        <text x="16" y="72" class="weight">weight −0.18</text>
        <text x="16" y="101" class="tag" fill="#7ed6c6">FROM A</text>
      </g>
      <g transform="translate(542 622)" filter="url(#shadow)">
        <rect width="158" height="124" rx="12" fill="#18352f" stroke="#7ed6c6" stroke-width="2" />
        <rect width="158" height="7" rx="4" fill="#7ed6c6" />
        <text x="16" y="44" class="connection">bias → output</text>
        <text x="16" y="72" class="weight">weight +0.12</text>
        <text x="16" y="101" class="tag" fill="#7ed6c6">FROM B</text>
      </g>
      <g transform="translate(734 622)" filter="url(#shadow)">
        <rect width="158" height="124" rx="12" fill="#2e2b22" stroke="#ff7a4f" stroke-width="2" />
        <rect width="158" height="7" rx="4" fill="#ff7a4f" />
        <text x="16" y="44" class="connection">input 0 → hidden</text>
        <text x="16" y="72" class="weight">weight +0.74</text>
        <text x="16" y="101" class="tag" fill="#ff7a4f">FROM A</text>
      </g>
      <g transform="translate(926 622)" filter="url(#shadow)">
        <rect width="158" height="124" rx="12" fill="#18352f" stroke="#7ed6c6" stroke-width="2" />
        <rect width="158" height="7" rx="4" fill="#7ed6c6" />
        <text x="16" y="44" class="connection">hidden → output</text>
        <text x="16" y="72" class="weight">weight −0.55</text>
        <text x="16" y="101" class="tag" fill="#7ed6c6">FROM A</text>
      </g>
      <g transform="translate(1118 622)" filter="url(#shadow)">
        <rect width="158" height="124" rx="12" fill="#322f22" stroke="#f3c77b" stroke-width="2" />
        <rect width="158" height="7" rx="4" fill="#f3c77b" />
        <text x="16" y="44" class="connection">input 1 → hidden</text>
        <text x="16" y="72" class="weight">weight +0.29</text>
        <text x="16" y="101" class="tag" fill="#f3c77b">FROM B</text>
      </g>
    </g>

    <g transform="translate(54 810)">
      <rect width="1292" height="66" rx="13" fill="#17332d" stroke="#7ed6c6" stroke-opacity="0.24" />
      <text x="26" y="28" class="footer-strong">Why the IDs matter:</text>
      <text x="218" y="28" class="footer">innovation #4 lines up even though each parent reached that structure through a different set of mutations.</text>
      <text x="26" y="52" class="footer">Crossover compares IDs instead of guessing which differently shaped connections are related.</text>
    </g>
  </g>
</svg>
